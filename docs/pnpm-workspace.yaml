# Makes docs/ its own pnpm workspace root, so installing/building the docs
# site never affects the MCSM app's lockfile or Docker build (and vice versa).
allowBuilds:
  # v13 ships prebuilt N-API binaries in prebuilds/ and loads them directly.
  # Allowing its build makes pnpm run node-gyp anyway, which fails in the
  # node:22-slim image (no Python/toolchain).
  better-sqlite3: false
  esbuild: true
  sharp: true
  '@parcel/watcher': true
  workerd: true
  vue-demi: true
  # maplibre-gl is pulled in by nuxt-charts (vue-chrts) for map charts, which
  # the docs demos don't use — no need to run its build scripts.
  maplibre-gl: false
overrides:
  # 2.1.3 recurses infinitely through remark-mdc's `strong` handler
  # ("Maximum call stack size exceeded"), breaking /llms-full.txt.
  'mdast-util-to-markdown': '2.1.2'
