name: Setup
description: Install pnpm, Node and the project dependencies

runs:
  using: composite
  steps:
    # pnpm must be on PATH before setup-node so it can wire up the store cache.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .nvmrc
        cache: pnpm

    # postinstall runs `nuxt prepare`, which generates the .nuxt types that
    # typecheck and lint rely on.
    - run: pnpm install --frozen-lockfile
      shell: bash
