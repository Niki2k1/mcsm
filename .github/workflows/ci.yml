name: ci

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# A new push to a PR supersedes the running checks; main keeps every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint:
    name: Lint & format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm lint

  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - run: pnpm typecheck

  # Builds the same image release.yml publishes and boots it. Several failures
  # only show at runtime in the built image (missing libsql native bindings,
  # migrations, the .data/db directory), so a passing build alone isn't enough.
  docker:
    name: Docker build & smoke test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Reads the cache release.yml writes on main; PRs don't write to it, so
      # throwaway branches can't evict the canary build's layers.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: mcsm:ci
          cache-from: type=gha

      - name: Boot the image
        run: |
          docker run -d --name mcsm -p 3000:3000 \
            -e NUXT_SESSION_PASSWORD="$(openssl rand -hex 32)" \
            mcsm:ci

      # /api/auth/setup is public and reads the users table, so a 200 with
      # needsSetup=true proves the server started, the SQLite driver loaded
      # and the migrations ran.
      - name: Smoke test
        run: |
          for _ in $(seq 1 30); do
            if body=$(curl -fsS http://localhost:3000/api/auth/setup); then
              echo "$body"
              echo "$body" | grep -q '"needsSetup":true' && exit 0
              echo "::error::Unexpected response from /api/auth/setup"
              exit 1
            fi
            sleep 2
          done
          echo "::error::MCSM did not answer within 60s"
          exit 1

      - name: Container logs
        if: always()
        run: docker logs mcsm

  # Single required check for branch protection.
  ci-ok:
    name: CI OK
    needs: [lint, typecheck, docker]
    if: always()
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "$RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then
              echo "::error::A required job did not succeed."
              exit 1
            fi
          done
